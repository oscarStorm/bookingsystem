name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Wait for PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/testdb
        run: |
          python -c "
          import os, time, psycopg
          for i in range(30):
              try:
                  with psycopg.connect(os.environ['DATABASE_URL'], connect_timeout=3):
                      print('PostgreSQL is up'); break
              except Exception as e:
                  time.sleep(2)
          else:
              raise SystemExit('PostgreSQL never became reachable')
          "

      - name: Run pytest
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/testdb
          SECRET_KEY: ci-only-secret-key
          ENVIRONMENT: test
        run: pytest -v --tb=short
